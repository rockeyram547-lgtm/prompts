name: Scrape Faymas prompts

on:
  workflow_dispatch:        # lets you start it manually from the Actions tab
  schedule:
    - cron: "0 3 * * 1"     # and every Monday 03:00 UTC

permissions:
  contents: write           # needed so the job can commit the CSVs

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 340    # progress is saved, so a rerun continues where this stopped
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Only needed if the site is JS-rendered. If you use --render below, uncomment this:
      # - run: playwright install --with-deps chromium

      - name: Scrape and build CSVs
        run: python scrape_faymas.py      # add --render if needed

      - name: Commit results
        if: always()                      # save partial progress even if the scrape was cut off
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data output || true
          git diff --staged --quiet || git commit -m "Update prompts"
          git push
